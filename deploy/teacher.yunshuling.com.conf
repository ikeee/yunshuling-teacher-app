server
{
    listen 80;
    listen [::]:80;
    server_name teacher.yunshuling.com;
    root /www/wwwroot/teacher.yunshuling.com;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/teacher.yunshuling.com; }
    location / { return 301 https://$host$request_uri; }
    access_log /www/wwwlogs/teacher.yunshuling.com.log;
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name teacher.yunshuling.com;

    ssl_certificate     /www/server/panel/vhost/cert/teacher.yunshuling.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/teacher.yunshuling.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 访问口令：只给授权的人 ----
    auth_basic           "YSL Teacher Tools";
    auth_basic_user_file /etc/nginx/htpasswd/teacher.yunshuling.com.htpasswd;

    # ---- 不进搜索引擎 ----
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;

    # 门户站静态资源
    location ~* \.(?:css|js|svg|jpg|jpeg|png|woff2?)$ {
        root /www/wwwroot/teacher.yunshuling.com;
        expires 10m;
        access_log off;
    }

    # 子应用：B站下载器（nginx 剥掉 /bili 前缀再转给本机 8765）
    location = /bili { return 301 /bili/; }
    # ^~ 很关键：否则上面那条 *.js/*.css 正则 location 会先抢走 /bili/static/*，导致 404
    location ^~ /bili/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 子应用：小红书下载器（同样 ^~ 保护，端口 8766）
    location = /xhs { return 301 /xhs/; }
    location ^~ /xhs/ {
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    # 门户站页面（含 /bili 之外的路径）
    location / {
        root /www/wwwroot/teacher.yunshuling.com;
        try_files $uri $uri/ =404;
    }

    client_max_body_size 4m;
    access_log /www/wwwlogs/teacher.yunshuling.com.log;
}
